<!doctype html><html><head><meta charset="utf-8"><title>Mtrack output</title><meta name="viewport" content="width=device-width, initial-scale=1"><style>html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}img{width:100%;height:100%;object-fit:fill}button{position:fixed;left:16px;top:16px;border:1px solid #444;border-radius:6px;padding:10px;color:white;background:#181818;cursor:pointer}body:fullscreen button{display:none}</style></head><body><img alt=""><button title="Move this window to your projector, then enter fullscreen">Fullscreen output</button><script>
const img=document.querySelector('img');let url=null;let timer;const id=decodeURIComponent(location.pathname.split('/').pop());document.title=`Mtrack output · ${id}`;
document.querySelector('button').onclick=()=>document.body.requestFullscreen();
function clear(){img.removeAttribute('src');if(url){URL.revokeObjectURL(url);url=null;}}
function connect(){const ws=new WebSocket(`${location.protocol==='https:'?'wss:':'ws:'}//${location.host}/api/video/vj/output/${encodeURIComponent(id)}/ws`);ws.binaryType='blob';ws.onmessage=e=>{if(typeof e.data==='string'){clear();return;}const next=URL.createObjectURL(e.data);img.src=next;if(url)URL.revokeObjectURL(url);url=next;};ws.onclose=()=>{clear();timer=setTimeout(connect,1000);};window.addEventListener('beforeunload',()=>{clearTimeout(timer);ws.close();},{once:true});}connect();
</script></body></html>
